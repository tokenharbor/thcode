name: build-thcode

on:
  push:
    branches: [main]
    paths:
      - 'packages/opencode/**'
      - 'packages/core/**'
      - 'packages/script/**'
      - '.github/workflows/build-thcode.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs: macos-14            # Apple Silicon
            target: darwin-arm64
            asset: thcode-darwin-arm64.tar.gz
          - runs: macos-13            # Intel
            target: darwin-x64
            asset: thcode-darwin-x64.tar.gz
          - runs: ubuntu-latest       # x86_64 glibc
            target: linux-x64
            asset: thcode-linux-x64.tar.gz
    runs-on: ${{ matrix.runs }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (${{ matrix.target }}, single target)
        working-directory: packages/opencode
        run: bun run script/build.ts --single

      - name: Pack binary + license attribution as tarball
        run: |
          set -euo pipefail
          mkdir -p out/payload
          cp packages/opencode/dist/opencode-${{ matrix.target }}/bin/opencode out/payload/thcode
          chmod +x out/payload/thcode
          cp LICENSE out/payload/LICENSE
          cp NOTICE.md out/payload/NOTICE.md
          (cd out/payload && tar -czf ../${{ matrix.asset }} thcode LICENSE NOTICE.md)
          ls -lh out/

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Compute version tag
        id: ver
        run: |
          v=$(node -p "require('./packages/opencode/package.json').version")
          sha=$(git rev-parse --short HEAD)
          echo "tag=th-v${v}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: thcode ${{ steps.ver.outputs.version }} (multi-platform)
          body: |
            thcode binary built from tokenharbor/thcode fork of opencode ${{ steps.ver.outputs.version }}.
            Auto-generated by GitHub Actions on commit ${{ github.sha }}.

            Assets:
              - `thcode-darwin-arm64.tar.gz` — macOS Apple Silicon (M1/M2/M3/M4)
              - `thcode-darwin-x64.tar.gz`   — macOS Intel
              - `thcode-linux-x64.tar.gz`    — Linux x86_64 (glibc)

            The thcode wrapper auto-detects your platform and downloads the right asset.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            out/thcode-darwin-arm64.tar.gz
            out/thcode-darwin-x64.tar.gz
            out/thcode-linux-x64.tar.gz
