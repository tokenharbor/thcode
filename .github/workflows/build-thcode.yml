name: build-thcode

on:
  push:
    branches: [main]
    paths:
      - 'packages/opencode/**'
      - 'packages/core/**'
      - 'packages/script/**'
      - '.github/workflows/build-thcode.yml'
  workflow_dispatch:

jobs:
  build-mac:
    # Single macos-14 (Apple Silicon) runner cross-compiles BOTH Mac
    # arches. Avoids the macos-13 (Intel) free-tier queue which
    # routinely sits at 30+ minutes.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (darwin-arm64 + darwin-x64)
        working-directory: packages/opencode
        env:
          BUN_TARGETS: darwin-arm64,darwin-x64
        run: bun run script/build.ts

      - name: Pack mac arm64 tarball
        run: |
          set -euo pipefail
          mkdir -p out/payload-arm64
          cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode out/payload-arm64/thcode
          chmod +x out/payload-arm64/thcode
          cp LICENSE out/payload-arm64/LICENSE
          cp NOTICE.md out/payload-arm64/NOTICE.md
          (cd out/payload-arm64 && tar -czf ../thcode-darwin-arm64.tar.gz thcode LICENSE NOTICE.md)

      - name: Pack mac x64 tarball
        run: |
          set -euo pipefail
          mkdir -p out/payload-x64
          cp packages/opencode/dist/opencode-darwin-x64/bin/opencode out/payload-x64/thcode
          chmod +x out/payload-x64/thcode
          cp LICENSE out/payload-x64/LICENSE
          cp NOTICE.md out/payload-x64/NOTICE.md
          (cd out/payload-x64 && tar -czf ../thcode-darwin-x64.tar.gz thcode LICENSE NOTICE.md)
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: mac-binaries
          path: |
            out/thcode-darwin-arm64.tar.gz
            out/thcode-darwin-x64.tar.gz
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (linux-x64)
        working-directory: packages/opencode
        env:
          BUN_TARGETS: linux-x64
        run: bun run script/build.ts

      - name: Pack linux x64 tarball
        run: |
          set -euo pipefail
          mkdir -p out/payload
          cp packages/opencode/dist/opencode-linux-x64/bin/opencode out/payload/thcode
          chmod +x out/payload/thcode
          cp LICENSE out/payload/LICENSE
          cp NOTICE.md out/payload/NOTICE.md
          (cd out/payload && tar -czf ../thcode-linux-x64.tar.gz thcode LICENSE NOTICE.md)
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: out/thcode-linux-x64.tar.gz
          retention-days: 1

  release:
    needs: [build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Compute version tag
        id: ver
        run: |
          v=$(node -p "require('./packages/opencode/package.json').version")
          sha=$(git rev-parse --short HEAD)
          echo "tag=th-v${v}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: thcode ${{ steps.ver.outputs.version }} (multi-platform)
          body: |
            thcode binary built from tokenharbor/thcode fork of opencode ${{ steps.ver.outputs.version }}.
            Auto-generated by GitHub Actions on commit ${{ github.sha }}.

            Assets:
              - `thcode-darwin-arm64.tar.gz` — macOS Apple Silicon (M1/M2/M3/M4)
              - `thcode-darwin-x64.tar.gz`   — macOS Intel
              - `thcode-linux-x64.tar.gz`    — Linux x86_64 (glibc)

            The thcode wrapper auto-detects your platform and downloads the right asset.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            out/thcode-darwin-arm64.tar.gz
            out/thcode-darwin-x64.tar.gz
            out/thcode-linux-x64.tar.gz
