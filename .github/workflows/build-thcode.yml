name: build-thcode

on:
  push:
    branches: [main]
    paths:
      - 'packages/opencode/**'
      - 'packages/core/**'
      - 'packages/script/**'
      - '.github/workflows/build-thcode.yml'
  workflow_dispatch:

jobs:
  build-mac-arm64:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build (darwin-arm64, single target)
        working-directory: packages/opencode
        run: bun run script/build.ts --single

      - name: Pack binary + license attribution as tarball
        run: |
          set -euo pipefail
          mkdir -p out/payload
          cp packages/opencode/dist/opencode-darwin-arm64/bin/opencode out/payload/thcode
          chmod +x out/payload/thcode
          cp LICENSE out/payload/LICENSE
          cp NOTICE.md out/payload/NOTICE.md
          (cd out/payload && tar -czf ../thcode-darwin-arm64.tar.gz thcode LICENSE NOTICE.md)
          ls -lh out/

      - name: Compute version tag
        id: ver
        run: |
          v=$(node -p "require('./packages/opencode/package.json').version")
          sha=$(git rev-parse --short HEAD)
          echo "tag=th-v${v}-${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: thcode ${{ steps.ver.outputs.version }} (mac arm64)
          body: |
            thcode binary built from tokenharbor/thcode fork of opencode ${{ steps.ver.outputs.version }}.
            Auto-generated by GitHub Actions on commit ${{ github.sha }}.
          draft: false
          prerelease: true
          make_latest: true
          files: |
            out/thcode-darwin-arm64.tar.gz
